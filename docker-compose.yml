version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tryon
      POSTGRES_PASSWORD: tryon_dev_password
      POSTGRES_DB: tryon
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: tryon_admin
      MINIO_ROOT_PASSWORD: tryon_dev_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  python-cv:
    build: ./python-cv
    environment:
      - PORT=8000
    ports:
      - "8000:8000"

  go-api:
    build: ./go-api
    environment:
      - PORT=8080
      - PYTHON_CV_URL=http://python-cv:8000
      - DATABASE_URL=postgres://tryon:tryon_dev_password@postgres:5432/tryon?sslmode=disable
      - REDIS_URL=redis:6379
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=tryon_admin
      - S3_SECRET_KEY=tryon_dev_password
      - S3_BUCKET=tryon-photos
    depends_on:
      - postgres
      - redis
      - minio
      - python-cv
    ports:
      - "8080:8080"

volumes:
  pgdata:
  miniodata:
